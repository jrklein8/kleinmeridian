name: Update Storm Lead Data

on:
  schedule:
    - cron: '0 7 * * *'     # 7:00 AM UTC (~2 AM ET)
    - cron: '0 19 * * *'    # 7:00 PM UTC (~2 PM ET)
  workflow_dispatch: {}

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r pipelines/storm_leads/requirements.txt

      - name: Build storm-lead data (NWS reports + warnings + MRMS radar)
        run: python pipelines/build_storm_leads.py

      - name: Build site
        run: node build.js

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add leads/data/ docs/leads/ pipelines/storm_leads/mesh_cache/
          git diff --staged --quiet || git commit -m "chore: update storm lead data [skip ci]"
          git push
